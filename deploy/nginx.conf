# Host nginx site config for GBOolder (Docker Compose on 127.0.0.1:3000).
#
# Install:
#   sudo cp nginx.conf /etc/nginx/sites-available/gboolder
#   sudo ln -s /etc/nginx/sites-available/gboolder /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL: use certbot, or your existing certificate paths below.

upstream gboolder_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.gboolder.example gboolder.example;

    # certbot: sudo certbot --nginx -d www.gboolder.example -d gboolder.example
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.gboolder.example gboolder.example;

    # certbot paths (Debian/Ubuntu) — adjust if yours differ
    ssl_certificate     /etc/letsencrypt/live/www.gboolder.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.gboolder.example/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://gboolder_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }
}
