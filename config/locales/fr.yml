    about:
      site_name: GBOolder
      title_prefix: À propos de
      history:
        title: L'histoire
        p1: "GBOolder est un guide d'escalade de bloc communautaire pour Göteborg et la côte ouest suédoise, fork du projet open source Boolder."
        p2: "Nous partons de la base de données maintenue par GBO (Bouldering Göteborg & Västkusten) et visons à améliorer la précision GPS, les contours de blocs et les topos grâce à la communauté."
        p3: "Le code et le workflow de cartographie viennent de Boolder — une plateforme moderne pour cartes interactives, photos topo et contributions."
        p4: ""
        podcast: ""
      project:
        title: Le projet
        contact: contacter
        p1: GBOolder est un projet communautaire basé sur des logiciels open source.
        p2_html: Notre but est de faciliter la découverte de l'escalade de bloc autour de Göteborg de façon <strong>ludique</strong>, <strong>précise</strong> et dans le <strong>respect de la nature</strong>.
        p3_html: Nous accueillons les suggestions et contributions de la communauté locale. N'hésitez pas à nous %{link} !
      team:
        title: La communauté
        community_desc: GBOolder est maintenu par des bénévoles. Envie d'aider avec la cartographie, le code ou les données ? Consultez la page contribuer.
      data:
        title: Données et licence
        p1_html: Les noms de voies, cotations et données de secteurs initiales viennent de <a href="https://gbo.crimp.se/">GBO</a>, sous licence <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a>.
        p2: "Exemple d'attribution : Données de voies initialement de GBO, améliorées par la communauté GBOolder."
        p3_html: Les données dérivées de GBOolder et les contributions communautaires utilisent la même licence NC-SA. Le code est forké de <a href="https://github.com/boolder-org/boolder-rails">Boolder</a> — voir les licences upstream pour le code.
      contact:
        title: Contact
        p1: Pour toute question, vous pouvez nous contacter à l'adresse
      support:
        title: Remerciements
        p1: "Merci à GBO pour la base de données originale de Göteborg, et à l'équipe Boolder pour la plateforme open source sur laquelle ce projet s'appuie."
        p2_html: Merci à %{link_gbo} pour les données de voies et au projet %{link_boolder} pour l'architecture de l'application.
        p3_html: ""
        app: appli
      open:
        title: Une plateforme collaborative
        p1_html: Le code est disponible en open source sur %{link}.
        p2_html: Il est également possible de %{link} en cartographiant les voies manquantes, en améliorant le GPS ou en signalant des erreurs.
        contribute_link: contribuer
      web_dev:
        title: Vous savez coder ?
        p1_html: Nous accueillons les contributions au code %{link_web}. Venez contribuer !
      faq:
        title: Questions fréquentes
        data:
          question: D'où viennent les données ?
          p1: Les noms de voies et cotations viennent de GBO (gbo.crimp.se). Les coordonnées GPS et contours de blocs sont améliorés par la communauté GBOolder.
          p2_html: Les données initiales viennent de %{link_gbo}. Les contributions communautaires affinent emplacements, topos et polygones de blocs.
          p3: Les données GBOolder sont sous licence CC BY-NC-SA 4.0 — comme le jeu de données GBO source.
        why_free:
          question: Pourquoi est-ce gratuit ?
          p1: Parce que nous voulons que le plus grand nombre puisse profiter de l'escalade autour de Göteborg !
          p2: GBOolder est un projet communautaire bénévole basé sur des logiciels open source.
        privacy:
          question: Quelles données personnelles récoltez-vous ?
          p1_html: Vous pouvez consulter notre %{link}.
          policy: politique de confidentialité
      metas:
        title: À propos de GBOolder
